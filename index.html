<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070d">
<title>EDITH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#e21b2d;--red2:#ff3348;--blue:#0756a8;--blue2:#168cff;--gold:#d9a62e;--gold2:#ffd866}
body{min-height:100vh;overflow:hidden;color:#fff;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 45%,rgba(12,67,125,.3),transparent 28%),radial-gradient(circle at 50% 48%,rgba(210,22,44,.12),transparent 45%),linear-gradient(145deg,#020307,#07101d 45%,#03050a)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent)}
body:after{content:"";position:fixed;width:500px;height:500px;left:50%;top:48%;transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 0deg,rgba(226,27,45,.05),rgba(7,86,168,.08),rgba(226,27,45,.05),rgba(7,86,168,.08));filter:blur(50px);pointer-events:none;animation:bgPulse 5s ease-in-out infinite}
.app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:25px 20px 18px;position:relative;z-index:2}
.header{width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center;animation:fadeDown .8s ease}
.brand{display:flex;flex-direction:column;gap:3px}.brand-main{font-size:25px;font-weight:800;letter-spacing:8px;background:linear-gradient(90deg,#fff,var(--gold2),#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.brand-sub{font-size:7px;letter-spacing:4px;color:rgba(255,255,255,.45)}
.status{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.65)}.status-dot{width:7px;height:7px;border-radius:50%;background:#3cff9a;box-shadow:0 0 8px #3cff9a,0 0 18px rgba(60,255,154,.6);animation:blink 2s infinite}
.main{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}.greeting{width:min(90%,650px);text-align:center;margin-bottom:25px;animation:fadeUp .9s ease}.greeting h1{font-size:clamp(25px,7vw,48px);font-weight:300;letter-spacing:3px;text-shadow:0 0 20px rgba(255,255,255,.12)}.greeting p{margin-top:9px;min-height:18px;font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.52);transition:.3s}
.reactor-container{position:relative;width:275px;height:275px;display:flex;align-items:center;justify-content:center;margin-bottom:22px}.reactor-field{position:absolute;width:270px;height:270px;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(22,140,255,.4) 45deg,transparent 85deg,rgba(226,27,45,.3) 135deg,transparent 180deg,rgba(22,140,255,.4) 225deg,transparent 270deg,rgba(226,27,45,.3) 315deg,transparent);filter:blur(3px);opacity:.7;animation:rotate 14s linear infinite}.armor-ring{position:absolute;width:245px;height:245px;border-radius:50%;border:2px solid rgba(217,166,46,.65);box-shadow:0 0 8px rgba(217,166,46,.25),inset 0 0 12px rgba(217,166,46,.12);animation:armor 3s ease-in-out infinite}.red-ring{position:absolute;width:225px;height:225px;border-radius:50%;border:5px dotted rgba(226,27,45,.7);transform:rotate(18deg);box-shadow:0 0 12px rgba(226,27,45,.25);animation:reverseRotate 9s linear infinite}.blue-ring{position:absolute;width:205px;height:205px;border-radius:50%;border:2px dashed rgba(22,140,255,.75);animation:rotate 7s linear infinite}.gold-ring{position:absolute;width:178px;height:178px;border-radius:50%;border:3px solid rgba(255,216,102,.75);box-shadow:0 0 10px rgba(255,216,102,.25),inset 0 0 12px rgba(255,216,102,.12)}
.reactor-core{position:relative;width:142px;height:142px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#fff 0%,#d7fbff 7%,#4edcff 20%,#1179bb 38%,#082641 58%,#050a12 72%);border:5px solid rgba(205,216,225,.65);box-shadow:0 0 12px rgba(70,220,255,.9),0 0 30px rgba(22,140,255,.7),0 0 65px rgba(22,140,255,.4);animation:breathe 3s ease-in-out infinite;z-index:5}.core-triangle{position:absolute;width:78px;height:78px;border:3px solid rgba(215,250,255,.95);clip-path:polygon(50% 0%,100% 100%,0% 100%);transform:rotate(180deg);filter:drop-shadow(0 0 7px #65e8ff);animation:triangle 2s ease-in-out infinite}.core-inner{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#dfffff 20%,#6cecff 48%,#0e86c4 70%,transparent 72%);box-shadow:0 0 15px #fff,0 0 35px #5ee8ff,0 0 60px rgba(22,140,255,.9);z-index:7}
.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 10px #54e5ff}.one{top:28px;left:72px}.two{right:32px;top:110px}.three{bottom:38px;left:82px}.four{left:35px;top:145px}.particle{animation:particle 3.5s infinite}
.listen-button{position:absolute;z-index:20;width:92px;height:92px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:radial-gradient(circle at 35% 30%,rgba(226,27,45,.4),rgba(8,16,29,.97) 65%);color:#fff;font-size:10px;font-weight:700;letter-spacing:3px;cursor:pointer;box-shadow:0 0 18px rgba(226,27,45,.2),inset 0 0 20px rgba(7,86,168,.2);transition:.2s;overflow:hidden}.listen-button:before{content:"";position:absolute;inset:5px;border-radius:50%;border:1px solid rgba(22,140,255,.55)}.listen-button:after{content:"";position:absolute;width:100%;height:2px;left:0;top:50%;background:linear-gradient(90deg,transparent,rgba(255,51,72,.8),transparent);animation:scan 2.5s linear infinite}.listen-button:hover{transform:scale(1.06);border-color:rgba(255,216,102,.8);box-shadow:0 0 25px rgba(226,27,45,.4),0 0 45px rgba(22,140,255,.25),inset 0 0 25px rgba(7,86,168,.25)}.listen-button:active{transform:scale(.92)}.listen-button.active{border-color:#fff;box-shadow:0 0 20px #ff3348,0 0 45px #168cff,inset 0 0 25px rgba(255,255,255,.18)}
.reactor-container.active .reactor-core{animation:ignite .8s ease-out,breathe 3s ease-in-out .8s infinite;box-shadow:0 0 20px #fff,0 0 45px #58e8ff,0 0 90px #168cff,0 0 140px rgba(22,140,255,.7)}.reactor-container.active .reactor-field{opacity:1;filter:blur(1px);animation:rotate 2s linear infinite}.reactor-container.active .armor-ring{border-color:var(--gold2);box-shadow:0 0 18px rgba(255,216,102,.7),inset 0 0 20px rgba(255,216,102,.3)}.reactor-container.active .red-ring{border-color:var(--red2);box-shadow:0 0 25px rgba(255,51,72,.8)}.reactor-container.active .blue-ring{border-color:var(--blue2);box-shadow:0 0 25px rgba(22,140,255,.8)}
.footer{font-size:7px;letter-spacing:3px;color:rgba(255,255,255,.25);padding-top:8px}
@keyframes breathe{0%,100%{transform:scale(.96)}50%{transform:scale(1.04)}}@keyframes ignite{0%{transform:scale(1)}35%{transform:scale(1.22)}65%{transform:scale(1.08)}100%{transform:scale(1)}}@keyframes triangle{0%,100%{opacity:.65;transform:rotate(180deg) scale(.95)}50%{opacity:1;transform:rotate(180deg) scale(1.08)}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes reverseRotate{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}@keyframes armor{0%,100%{opacity:.65}50%{opacity:1}}@keyframes particle{0%,100%{transform:translateY(0) scale(.7);opacity:.3}50%{transform:translateY(-12px) scale(1.3);opacity:1}}@keyframes scan{from{transform:translateY(-45px)}to{transform:translateY(45px)}}@keyframes blink{50%{opacity:.3}}@keyframes bgPulse{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.9)}50%{opacity:.9;transform:translate(-50%,-50%) scale(1.1)}}@keyframes fadeDown{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:420px){.app{padding:20px 14px 14px}.brand-main{font-size:21px;letter-spacing:6px}.reactor-container{transform:scale(.86);margin-top:-8px;margin-bottom:2px}.greeting{margin-bottom:2px}.greeting h1{font-size:27px}.listen-button{width:84px;height:84px}}@media(max-height:650px){.reactor-container{transform:scale(.72);margin-top:-30px;margin-bottom:-35px}.greeting{margin-bottom:0}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="brand"><div class="brand-main">EDITH</div><div class="brand-sub">PERSONAL AI SYSTEM</div></div><div class="status"><span class="status-dot"></span>ONLINE</div></header>
<main class="main">
<div class="greeting"><h1 id="greetingTitle">Good evening.</h1><p id="greetingText">HOW CAN I ASSIST YOU?</p></div>
<div class="reactor-container" id="reactor">
<div class="reactor-field"></div><div class="armor-ring"></div><div class="red-ring"></div><div class="blue-ring"></div><div class="gold-ring"></div>
<div class="particle one"></div><div class="particle two"></div><div class="particle three"></div><div class="particle four"></div>
<div class="reactor-core"><div class="core-triangle"></div><div class="core-inner"></div></div>
<button class="listen-button" id="askButton" type="button">ASK</button>
</div>
</main>
<footer class="footer">EDITH • AI CORE ONLINE</footer>
</div>
<script>
const askButton=document.getElementById("askButton");
const reactor=document.getElementById("reactor");
const greetingTitle=document.getElementById("greetingTitle");
const greetingText=document.getElementById("greetingText");
let conversationHistory=[];
const BACKEND_URL="https://script.google.com/macros/s/AKfycbweIO7Yd7C5CDaym0vZYTY230AyH2HYlbr60Cl_ibl2GjYu8RcW9hjwtBnTDFHZHZpwCeQ/exec";
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
function resetButton(){reactor.classList.remove("active");askButton.classList.remove("active");askButton.textContent="ASK"}
function setStatus(title,text){greetingTitle.textContent=title;greetingText.textContent=text||""}
if(SpeechRecognition){
const recognition=new SpeechRecognition();
recognition.lang="en-IN";recognition.continuous=false;recognition.interimResults=false;
askButton.addEventListener("click",()=>{reactor.classList.add("active");askButton.classList.add("active");askButton.textContent="LISTENING";setStatus("Listening...","SPEAK NOW");try{recognition.start()}catch(e){}});
recognition.onresult=async event=>{
const text=event.results[0][0].transcript.trim();
if(!text){resetButton();setStatus("Ready.","HOW CAN I ASSIST YOU?");return}
setStatus("Thinking...","EDITH IS PROCESSING YOUR REQUEST");askButton.textContent="THINKING";
try{
const response=await fetch(BACKEND_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({userText:text,history:conversationHistory})});
const data=await response.json();
if(data.ok===true||data.success===true){const reply=data.reply||data.text||data.response||"I received your request.";conversationHistory.push({user:text,assistant:reply});setStatus(reply,"");const speech=new SpeechSynthesisUtterance(reply);speech.lang="en-IN";speech.rate=1;speech.pitch=1;window.speechSynthesis.cancel();window.speechSynthesis.speak(speech)}else{setStatus("EDITH ERROR",data.error||"The backend did not return a valid response.")}
}catch(error){console.log(error);setStatus("CONNECTION ERROR","PLEASE CHECK THE BACKEND CONNECTION")}
resetButton();
};
recognition.onerror=()=>{setStatus("Voice input failed.","PLEASE TRY AGAIN");resetButton()};
recognition.onend=()=>{if(askButton.textContent==="LISTENING")resetButton()};
}else{setStatus("Voice unavailable.","THIS BROWSER DOES NOT SUPPORT SPEECH INPUT")}
</script>
</body>
</html>
